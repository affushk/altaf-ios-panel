name: Build Altaf APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'altaf-ios-panel-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: unzip -q altaf-ios-panel-source.zip -d android-project

      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build and lint
        working-directory: android-project
        run: gradle --no-daemon assembleDebug lintDebug --stacktrace

      - name: Download APK here
        uses: actions/upload-artifact@v4
        with:
          name: Altaf-iOS-Panel-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lint-report
          path: android-project/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
